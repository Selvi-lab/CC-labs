<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mystery Solver in the Enchanted Forest</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #001f1f;
      color: white;
      font-family: "Comic Sans MS", "Poppins", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h1 {
      font-size: 3em;
      text-shadow: 0 0 20px #00ffcc;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: -1;
    }

    button {
      background-color: #ffcc00;
      border: none;
      padding: 12px 25px;
      font-size: 1em;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.3s;
    }

    button:hover {
      background-color: #ff9900;
      transform: scale(1.05);
    }

    #clue {
      font-size: 1.2em;
      background-color: rgba(0, 0, 0, 0.5);
      padding: 10px 20px;
      border-radius: 15px;
      margin-top: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <h1>🌙 Mystery Solver in the Enchanted Forest</h1>
  <p>Catch the glowing fireflies to reveal your next clue!</p>
  <button onclick="showClue()">Catch a Firefly</button>
  <div id="clue"></div>

  <canvas id="forest"></canvas>

  <script>
    // 🎨 Canvas animation setup
    const canvas = document.getElementById('forest');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const fireflies = [];
    for (let i = 0; i < 40; i++) {
      fireflies.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2 + 1,
        dx: (Math.random() - 0.5) * 2,
        dy: (Math.random() - 0.5) * 2
      });
    }

    function drawFireflies() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(0, 255, 200, 0.8)';
      fireflies.forEach(f => {
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
        f.x += f.dx;
        f.y += f.dy;

        if (f.x < 0 || f.x > canvas.width) f.dx *= -1;
        if (f.y < 0 || f.y > canvas.height) f.dy *= -1;
      });
      requestAnimationFrame(drawFireflies);
    }

    drawFireflies();

    // 🕵️‍♀️ Interactive clues
    const clues = [
      "✨ Clue 1: A sparkle hides near the tallest tree!",
      "🐾 Clue 2: Follow the glowing footprints to find the secret path.",
      "🌕 Clue 3: When the moon rises, the treasure will glow.",
      "🎉 Congratulations! You solved the mystery of the Enchanted Forest! 🌳💎"
    ];

    let clueIndex = 0;

    function showClue() {
      const clueDiv = document.getElementById("clue");
      clueDiv.style.display = "block";
      clueDiv.innerHTML = clues[clueIndex];
      clueIndex = (clueIndex + 1) % clues.length;
    }

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
